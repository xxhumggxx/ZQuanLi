<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trà Chanh Zody – Đăng Nhập Ca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
/* ── Login page specific ── */
body { background: var(--bg); min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }

.login-wrap {
  width: 100%; max-width: 440px;
  background: var(--card);
  border-radius: 20px;
  padding: 48px 40px 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,.18), 0 0 0 1px var(--border);
  text-align:center;
}
.brand-logo { font-size:2.4rem; font-weight:800; color:var(--primary); margin-bottom:4px; letter-spacing:-1px; }
.brand-sub  { font-size:.85rem; color:var(--muted); margin-bottom:32px; }

.input-group { text-align:left; margin-bottom:20px; }
.input-group label { font-size:.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; display:block; margin-bottom:8px; }
.input-group input {
  width:100%; padding:14px 16px; border-radius:12px;
  border:1.5px solid var(--border); background:var(--bg);
  color:var(--text); font-size:1.05rem; font-family:inherit;
  transition: border-color .2s, box-shadow .2s;
  box-sizing:border-box;
}
.input-group input:focus { outline:none; border-color:var(--primary); box-shadow: 0 0 0 3px rgba(234,88,12,.15); }

.btn-login {
  width:100%; padding:15px; border-radius:12px;
  background: linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff; font-size:1rem; font-weight:700; letter-spacing:.03em;
  border:none; cursor:pointer; transition: transform .15s, box-shadow .15s;
  margin-top:4px;
}
.btn-login:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(234,88,12,.35); }
.btn-login:active{ transform:translateY(0); }

.err-msg { color:#ef4444; font-size:.85rem; margin-top:12px; display:none; }

.shift-badge { display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:40px; background:var(--primary-soft); color:var(--primary); font-weight:700; font-size:.95rem; margin-bottom:28px; }

footer-link { display:block; margin-top:24px; font-size:.8rem; color:var(--muted); }
.admin-link { margin-top:20px; display:block; font-size:.82rem; color:var(--muted); text-decoration:none; }
.admin-link:hover { color:var(--primary); }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="brand-logo">🍋 Zody</div>
  <div class="brand-sub">Trà Chanh Zody – Hệ Thống Quản Lý Ca</div>

  <div id="login-form">
    <div class="input-group">
      <label>🔑 Mật Khẩu Ca</label>
      <input type="password" id="pwd" placeholder="Nhập mật khẩu ca của bạn..." autocomplete="off"/>
    </div>
    <button class="btn-login" onclick="doLogin()">Vào Ca →</button>
    <div class="err-msg" id="err">Sai mật khẩu hoặc ca không tồn tại</div>
  </div>

  <a href="/admin-login" class="admin-link">⚙️ Đăng nhập Admin</a>
</div>

<!-- ═══ SHIFT REPORT APP ═══ -->
<div id="app" style="display:none; width:100%; max-width:900px; padding:20px; box-sizing:border-box;">

  <!-- Header -->
  <div class="app-header">
    <div>
      <div class="brand-logo" style="font-size:1.5rem">🍋 Trà Chanh Zody</div>
      <div id="shift-info" class="shift-badge" style="margin-bottom:0; margin-top:6px;"></div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn-sm btn-success" onclick="submitReport()">✅ Chốt Ca</button>
      <button class="btn-sm btn-outline" onclick="doLogout()">Đăng Xuất</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="inventory" onclick="switchTab('inventory')">📦 Kiểm Kê</button>
    <button class="tab" data-tab="finance" onclick="switchTab('finance')">💰 Thu Chi</button>
  </div>

  <!-- ══ INVENTORY TAB ══ -->
  <div id="tab-inventory" class="tab-content">
    <div class="section-header">
      <h2>Kiểm Kê Nguyên Vật Liệu</h2>
      <div style="font-size:.82rem;color:var(--muted)" id="date-label"></div>
    </div>
    <div id="inventory-container"></div>
    <button class="btn-primary mt-20" onclick="saveInventory()">💾 Lưu Kiểm Kê</button>
  </div>

  <!-- ══ FINANCE TAB ══ -->
  <div id="tab-finance" class="tab-content" style="display:none">
    <div class="section-header">
      <h2>Báo Cáo Thu Chi Ca</h2>
    </div>

    <div class="finance-grid">
      <div class="fin-card">
        <label>💵 Tiền Đầu Ca (đ)</label>
        <input type="number" id="opening_cash" class="fin-input" placeholder="0"/>
      </div>
      <div class="fin-card">
        <label>🖥️ Tiền Phần Mềm (đ)</label>
        <input type="number" id="software_revenue" class="fin-input" placeholder="0"/>
      </div>
      <div class="fin-card">
        <label>🏦 Tiền Chuyển Khoản (đ)</label>
        <input type="number" id="bank_transfer" class="fin-input" placeholder="0"/>
      </div>
    </div>

    <!-- Chi tiêu -->
    <div class="card mt-20">
      <div class="card-head">
        <span>📋 Chi Tiêu Trong Ca</span>
        <button class="btn-sm btn-primary" onclick="showAddExpense()">+ Thêm Chi</button>
      </div>
      <div id="expense-list"></div>
      <div id="add-expense-form" class="add-expense-form" style="display:none">
        <input type="text" id="exp-desc" placeholder="Nội dung chi..." class="fin-input-sm"/>
        <input type="number" id="exp-amount" placeholder="Số tiền..." class="fin-input-sm"/>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn-sm btn-primary" onclick="addExpense()">Thêm</button>
          <button class="btn-sm btn-outline" onclick="hideAddExpense()">Huỷ</button>
        </div>
      </div>
    </div>

    <!-- Kết quả tính tiền -->
    <div class="finance-result mt-20" id="finance-result"></div>

    <button class="btn-primary mt-16" onclick="saveFinance()">💾 Lưu Thu Chi</button>
  </div>

</div>

<script src="/static/app.js"></script>
<script>
let reportId = null;
let inventoryData = [];
let expenseData  = [];

// ── Loading Indicator ──
function showLoading() {
  let loader = document.querySelector('.loader-overlay');
  if (!loader) {
    loader = document.createElement('div');
    loader.className = 'loader-overlay';
    loader.innerHTML = '<div class="spinner"></div>';
    loader.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    `;
    document.body.appendChild(loader);
  }
  loader.style.display = 'flex';
}

function hideLoading() {
  const loader = document.querySelector('.loader-overlay');
  if (loader) {
    loader.style.display = 'none';
  }
}

function doLogin() {
  const pwd = document.getElementById('pwd').value.trim();
  if (!pwd) return;
  showLoading();
  fetch('/api/login/shift', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password: pwd})
  }).then(r=>r.json()).then(d=>{
    hideLoading();
    if (d.error) { showErr(d.error); return; }
    reportId = d.report_id;
    document.getElementById('login-form').parentElement.style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('app').style.flexDirection='column';
    document.getElementById('app').style.alignItems='center';
    document.getElementById('shift-info').innerHTML = `🌟 ${d.shift_name} – ${todayStr()}`;
    document.getElementById('date-label').textContent = todayStr();
    loadInventory();
    loadExpenses();
    loadFinance();
  }).catch(err => {
    hideLoading();
    showErr('Lỗi kết nối');
  });
}

function showErr(msg){ const e=document.getElementById('err'); e.textContent=msg; e.style.display='block'; setTimeout(()=>e.style.display='none',3000); }

document.getElementById('pwd').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function todayStr(){
  const d=new Date();
  return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  document.getElementById('tab-inventory').style.display = tab==='inventory'?'block':'none';
  document.getElementById('tab-finance').style.display   = tab==='finance'?'block':'none';
}

// ── INVENTORY ──
function loadInventory(){
  showLoading();
  fetch('/api/inventory').then(r=>r.json()).then(data=>{
    hideLoading();
    inventoryData = data;
    renderInventory(data);
  }).catch(err=>{
    hideLoading();
    showToast('Lỗi tải kiểm kê', 'error');
  });
}

const CATEGORIES = ['TRÁI CÂY','KHÁC','SỮA / KEM','TOPPING','SỐT','TRÀ','ĂN VẶT'];

function renderInventory(data){
  const container = document.getElementById('inventory-container');
  const grouped = {};
  data.forEach(e=>{
    const cat = e.materials?.category || 'KHÁC';
    if (!grouped[cat]) grouped[cat]=[];
    grouped[cat].push(e);
  });

  let html = '';
  CATEGORIES.forEach(cat=>{
    if (!grouped[cat]) return;
    html += `<div class="inv-category">
      <div class="inv-cat-title">${catIcon(cat)} ${cat}</div>
      <div class="inv-grid">`;
    grouped[cat].forEach(e=>{
      const open = parseFloat(e.opening_qty)||0;
      html += `
      <div class="inv-item">
        <div class="inv-name">${e.material_name}</div>
        <div class="inv-meta">Đầu ca: <strong>${formatQty(open)} ${e.unit}</strong></div>
        <div class="inv-input-row">
          <input type="number" step="0.1" min="0"
            class="inv-input" id="inv-${e.id}"
            value="${parseFloat(e.closing_qty)||0}"
            oninput="updateInventoryDisplay('${e.id}','${e.unit}',${open},this.value)"
            placeholder="Số lượng cuối ca"/>
          <span class="inv-unit">${e.unit}</span>
        </div>
        <div class="inv-consumed" id="cons-${e.id}">
          ${calcConsumptionLabel(open, parseFloat(e.closing_qty)||0, e.unit)}
        </div>
        <input type="text" class="inv-note" id="note-${e.id}" value="${e.note||''}" placeholder="Ghi chú..."/>
      </div>`;
    });
    html += `</div></div>`;
  });
  container.innerHTML = html;
}

function updateInventoryDisplay(id, unit, open, closingVal){
  const consumed = open - parseFloat(closingVal||0);
  document.getElementById(`cons-${id}`).innerHTML = calcConsumptionLabel(open, parseFloat(closingVal||0), unit);
}

function calcConsumptionLabel(open, closing, unit){
  const c = open - closing;
  if (c > 0) return `<span class="tag-warn">⬇ Tiêu ${formatQty(c)} ${unit}</span>`;
  if (c < 0) return `<span class="tag-ok">⬆ Thêm ${formatQty(Math.abs(c))} ${unit}</span>`;
  return `<span class="tag-neutral">Không đổi</span>`;
}

function formatQty(v){ return parseFloat(v.toFixed(2)); }

function catIcon(c){
  const m={'TRÁI CÂY':'🍊','KHÁC':'🧊','SỮA / KEM':'🥛','TOPPING':'🫙','SỐT':'🧴','TRÀ':'🍵','ĂN VẶT':'🌻'};
  return m[c]||'📦';
}

async function saveInventory(){
  showLoading();
  try {
    const saves = inventoryData.map(e=>{
      const inp = document.getElementById(`inv-${e.id}`);
      const note = document.getElementById(`note-${e.id}`);
      return fetch(`/api/inventory/${e.id}`, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ closing_qty: parseFloat(inp?.value||0), note: note?.value||'' })
      });
    });
    await Promise.all(saves);
    showToast('✅ Đã lưu kiểm kê!');
  } catch(err){
    showToast('Lỗi lưu kiểm kê', 'error');
  } finally {
    hideLoading();
  }
}

// ── EXPENSES ──
function loadExpenses(){
  showLoading();
  fetch('/api/expenses').then(r=>r.json()).then(data=>{
    hideLoading();
    expenseData = data;
    renderExpenses();
  }).catch(err=>{
    hideLoading();
    showToast('Lỗi tải chi tiêu', 'error');
  });
}
function renderExpenses(){
  const list = document.getElementById('expense-list');
  if (!expenseData.length){ list.innerHTML='<div class="empty-state">Chưa có khoản chi nào</div>'; return; }
  list.innerHTML = expenseData.map(e=>`
    <div class="expense-row">
      <span class="exp-desc">${e.description}</span>
      <span class="exp-amount">${fmtMoney(e.amount)}đ</span>
      <button class="btn-icon-del" onclick="deleteExpense('${e.id}')">✕</button>
    </div>`).join('');
  calcFinance();
}
function showAddExpense(){ document.getElementById('add-expense-form').style.display='block'; }
function hideAddExpense(){ document.getElementById('add-expense-form').style.display='none'; }
function addExpense(){
  const desc = document.getElementById('exp-desc').value.trim();
  const amt  = parseFloat(document.getElementById('exp-amount').value)||0;
  if (!desc||!amt) return;
  showLoading();
  fetch('/api/expenses',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({description:desc,amount:amt})
  }).then(r=>r.json()).then(()=>{
    hideLoading();
    hideAddExpense();
    document.getElementById('exp-desc').value='';
    document.getElementById('exp-amount').value='';
    loadExpenses();
  }).catch(err=>{
    hideLoading();
    showToast('Lỗi thêm chi tiêu', 'error');
  });
}
function deleteExpense(id){
  showLoading();
  fetch(`/api/expenses/${id}`,{method:'DELETE'}).then(()=>{
    hideLoading();
    loadExpenses();
  }).catch(err=>{
    hideLoading();
    showToast('Lỗi xoá chi tiêu', 'error');
  });
}

// ── FINANCE ──
function loadFinance(){
  showLoading();
  fetch('/api/finance').then(r=>r.json()).then(d=>{
    hideLoading();
    if (d.finance){
      document.getElementById('opening_cash').value    = d.finance.opening_cash||0;
      document.getElementById('software_revenue').value= d.finance.software_revenue||0;
      document.getElementById('bank_transfer').value   = d.finance.bank_transfer||0;
    }
    calcFinance();
  }).catch(err=>{
    hideLoading();
    showToast('Lỗi tải thu chi', 'error');
  });
}
function calcFinance(){
  const opening  = parseFloat(document.getElementById('opening_cash').value)||0;
  const software = parseFloat(document.getElementById('software_revenue').value)||0;
  const bank     = parseFloat(document.getElementById('bank_transfer').value)||0;
  const totalExp = expenseData.reduce((s,e)=>s+parseFloat(e.amount),0);
  const actual   = software + opening - bank - totalExp;
  const toBring  = actual - 500000 - 30000;

  document.getElementById('finance-result').innerHTML = `
    <div class="result-grid">
      <div class="result-item">
        <div class="result-label">💵 Tiền Đầu Ca</div>
        <div class="result-value">${fmtMoney(opening)}đ</div>
      </div>
      <div class="result-item">
        <div class="result-label">🖥️ Tiền Phần Mềm</div>
        <div class="result-value">${fmtMoney(software)}đ</div>
      </div>
      <div class="result-item">
        <div class="result-label">🏦 Chuyển Khoản</div>
        <div class="result-value minus">−${fmtMoney(bank)}đ</div>
      </div>
      <div class="result-item">
        <div class="result-label">📋 Tổng Chi</div>
        <div class="result-value minus">−${fmtMoney(totalExp)}đ</div>
      </div>
      <div class="result-item highlight">
        <div class="result-label">🗄️ Tiền Thực Trong Két</div>
        <div class="result-value big">${fmtMoney(actual)}đ</div>
      </div>
      <div class="result-item">
        <div class="result-label">🏧 Két Giữ Lại</div>
        <div class="result-value">500,000đ</div>
      </div>
      <div class="result-item">
        <div class="result-label">🐷 Tiền Lợn</div>
        <div class="result-value">30,000đ</div>
      </div>
      <div class="result-item highlight-green">
        <div class="result-label">👜 Tiền Thừa Cầm Về</div>
        <div class="result-value big ${toBring<0?'minus':''}">${fmtMoney(toBring)}đ</div>
      </div>
    </div>`;
}
document.addEventListener('DOMContentLoaded',()=>{
  ['opening_cash','software_revenue','bank_transfer'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', calcFinance);
  });
});
function saveFinance(){
  showLoading();
  const payload = {
    opening_cash:     parseFloat(document.getElementById('opening_cash').value)||0,
    software_revenue: parseFloat(document.getElementById('software_revenue').value)||0,
    bank_transfer:    parseFloat(document.getElementById('bank_transfer').value)||0,
  };
  fetch('/api/finance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(()=>{
      hideLoading();
      showToast('✅ Đã lưu thu chi!');
    }).catch(err=>{
      hideLoading();
      showToast('Lỗi lưu thu chi', 'error');
    });
}

function submitReport(){
  if (!confirm('Chốt ca? Sau khi chốt sẽ không sửa được!')) return;
  showLoading();
  saveInventory().then(()=>saveFinance()).then(()=>{
    fetch('/api/report/submit',{method:'POST'})
      .then(()=>{
        hideLoading();
        showToast('🎉 Đã chốt ca thành công!');
        setTimeout(()=>doLogout(),2000);
      }).catch(err=>{
        hideLoading();
        showToast('Lỗi chốt ca', 'error');
      });
  });
}
function doLogout(){
  showLoading();
  fetch('/api/logout',{method:'POST'})
    .then(()=>{
      hideLoading();
      location.reload();
    }).catch(err=>{
      hideLoading();
      showToast('Lỗi đăng xuất', 'error');
    });
}
function fmtMoney(v){ return Math.round(v).toLocaleString('vi-VN'); }
</script>
</body>
</html>
